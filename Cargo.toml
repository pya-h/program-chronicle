[package]
name = "svm-indexer"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "migration"]

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"]}
dotenvy = "0.15"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
thiserror = "2.0.19"
tracing = "0.1"
tracing-panic = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"]}
sea-orm = { version = "2.0.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
subtle = "2.6.1"
url = "2.5.8"

[dev-dependencies]
httpc-test = "0.1.10"
