[package]
name = "svm-indexer"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "migration"]

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"]}
dotenvy = "0.15"
tower-http = { version = "0.6", features = ["fs"] }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
thiserror = "2.0.19"
tracing = "0.1"
tracing-panic = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"]}
sea-orm = { version = "2.0.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
subtle = "2.6.1"
url = "2.5.8"
solana-sdk = "2.3"
solana-client = "2.3"
solana-pubsub-client = "2.3"
solana-account-decoder = "2.3"
solana-rpc-client-api = "2.3"
solana-transaction-status = "2.3"
chrono = "0.4.45"
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
httpc-test = "0.1.10"
migration = { path = "migration" }
reqwest = "0.12"
chrono = "0.4"
