<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/htmx.org@1.9.12" crossorigin="anonymous"></script>
</head>
<body>
    <div class="app-loader" id="app-loader">
        <div class="loader-ring"></div>
        <span>Loading panel…</span>

                    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">

                        <circle cx="16" cy="16" r="5" fill="currentColor"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <span class="brand-title">Umbra</span>
                    <span class="brand-subtitle">SVM Indexer</span>
                </div>
            </div>

            <nav class="sidebar-nav" aria-label="Main navigation">
                <ul>
                    <li>
                        <a href="#" class="nav-item active"
                           hx-get="fragments/dashboard.html"
                           hx-target="#main-content"
                           hx-swap="innerHTML transition:true"
                           hx-indicator="#content-loader">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
                            </span>
                            <span class="nav-label">Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-item"
                           hx-get="fragments/rpcs.html"
                           hx-target="#main-content"
                           hx-swap="innerHTML transition:true"
                           hx-indicator="#content-loader">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                            </span>
                            <span class="nav-label">RPCs</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-item"
                           hx-get="fragments/programs.html"
                           hx-target="#main-content"
                           hx-swap="innerHTML transition:true"
                           hx-indicator="#content-loader">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                            </span>
                            <span class="nav-label">Programs</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-item"
                           hx-get="fragments/pdas.html"
                           hx-target="#main-content"
                           hx-swap="innerHTML transition:true"
                           hx-indicator="#content-loader">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                            </span>
                            <span class="nav-label">PDAs</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-item"
                           hx-get="fragments/history.html"
                           hx-target="#main-content"
                           hx-swap="innerHTML transition:true"
                           hx-indicator="#content-loader">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            </span>
                            <span class="nav-label">History</span>
                        </a>
                    </li>
                    <li class="nav-divider"></li>
                    <li>
                        <a href="#" class="nav-item"
                           hx-get="fragments/monitoring.html"
                           hx-target="#main-content"
                           hx-swap="innerHTML transition:true"
                           hx-indicator="#content-loader">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                            </span>
                            <span class="nav-label">Monitoring</span>
                            <span class="nav-badge pulse"></span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-item"
                           hx-get="fragments/settings.html"
                           hx-target="#main-content"
                           hx-swap="innerHTML transition:true"
                           hx-indicator="#content-loader">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                            </span>
                            <span class="nav-label">Settings</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <div class="status-pill">
                    <span class="status-dot online"></span>
                    <span class="status-text">Indexer online</span>
                </div>
                <div class="version">v0.1.0</div>
            </div>
        </aside>

        <!-- Main content area -->
        <main class="main">
            <header class="topbar">
                <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>

                <div class="breadcrumb" id="breadcrumb">
                    <span class="breadcrumb-current">Dashboard</span>
                </div>

                <div class="topbar-actions">
                    <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">
                        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    </button>
                    <button class="icon-btn" aria-label="Notifications">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                        <span class="icon-badge">2</span>
                    </button>
                    <div class="user-chip">
                        <div class="user-avatar">OP</div>
                        <span class="user-name">Operator</span>
                    </div>
                </div>
            </header>

            <div class="content-wrapper">
                <div id="content-loader" class="content-loader htmx-indicator">
                    <div class="loader-ring"></div>
                </div>
                <div id="main-content" class="main-content" hx-get="fragments/dashboard.html" hx-trigger="load once" hx-swap="innerHTML transition:true">
                    <!-- Initial content loaded by HTMX -->
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toast-container"></div>
    <script src="js/app.js"></script>
</body>
</html>
