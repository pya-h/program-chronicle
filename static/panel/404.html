<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umbra SVM Indexer — Not Found</title>
    <style>
        /* self-contained: this page is served at any depth, so it can't reference the panel's assets */
        :root {
            --bg-body: #0b0f19;
            --bg-surface: #111827;
            --border-color: rgba(148, 163, 184, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-500: #3b82f6;
            --accent-400: #60a5fa;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-body: #f1f5f9;
                --bg-surface: #ffffff;
                --border-color: rgba(100, 116, 139, 0.14);
                --text-primary: #0f172a;
                --text-secondary: #475569;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: var(--bg-body);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .card {
            width: 100%;
            max-width: 27rem;
            padding: 2.5rem 2rem;
            text-align: center;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
        }

        .code {
            margin: 0;
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--accent-500);
            font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        h1 {
            margin: 1rem 0 0.5rem;
            font-size: 1.25rem;
            font-weight: 600;
        }

        p {
            margin: 0 0 1.75rem;
            font-size: 0.9375rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        a {
            display: inline-block;
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            background: var(--accent-500);
            color: #f8fafc;
            font-size: 0.9375rem;
            font-weight: 500;
            text-decoration: none;
            transition: background 200ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        a:hover {
            background: var(--accent-400);
        }
    </style>
</head>
<body>
    <div class="card">
        <p class="code">404</p>
        <h1>Page not found</h1>
        <p>This panel page doesn't exist. It may have been moved, or the address was mistyped.</p>
        <a href="/panel/">Back to the panel</a>
    </div>
</body>
</html>
