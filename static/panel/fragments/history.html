<section class="section-shell" data-section="history">
    <header class="section-header">
        <div class="section-title-block">
            <h1 class="section-title">History</h1>
            <p class="section-description">Per-slot state history for a single account, newest first.</p>
        </div>
    </header>

    <article class="card">
        <div class="card-head">
            <div class="card-head-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>
            </div>
            <div>
                <h2 class="card-head-title">Account State History</h2>
                <p class="card-head-sub" id="history-count">Enter an account address to begin.</p>
            </div>
        </div>

        <div class="filter-bar">
            <div class="input-group history-address-group">
                <label for="history-address" class="input-label">Account Address</label>
                <input type="text" id="history-address" class="input-field" placeholder="Base-58 account address" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="history-from" class="input-label">From Slot</label>
                <input type="number" id="history-from" class="input-field" placeholder="min" min="0">
            </div>
            <div class="input-group">
                <label for="history-to" class="input-label">To Slot</label>
                <input type="number" id="history-to" class="input-field" placeholder="max" min="0">
            </div>
            <button type="button" class="btn btn-primary" id="history-load">Load</button>
        </div>

        <div id="history-root"></div>

        <div class="empty-state" id="history-empty" hidden>
            <div class="empty-state-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>
            </div>
            <p class="empty-state-title">No state history</p>
            <p class="empty-state-text">Enter an indexed account address, optionally narrowed by a slot range.</p>
        </div>

        <div class="list-pager" id="history-pager"></div>
    </article>
</section>
