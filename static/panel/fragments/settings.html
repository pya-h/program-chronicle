<section class="section-shell">
    <header class="section-header">
        <div class="section-title-block">
            <h1 class="section-title">Settings</h1>
            <p class="section-description">Appearance preferences. Changes apply instantly and are saved to this browser.</p>
        </div>
        <div class="section-actions">
            <button class="btn btn-secondary" data-reset-prefs>Reset to defaults</button>
        </div>
    </header>

    <div class="settings-grid" id="settings-panel">
        <div class="setting-group">
            <div class="setting-group-head">
                <span class="setting-group-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </span>
                <div>
                    <div class="setting-group-title">Appearance</div>
                    <div class="setting-group-sub">Theme, accent color, and motion</div>
                </div>
            </div>

            <div class="setting-row">
                <div class="setting-info">
                    <span class="setting-label">Theme</span>
                    <span class="setting-hint">Light, dark, or follow your system.</span>
                </div>
                <div class="setting-control">
                    <div class="segmented" role="group" aria-label="Theme">
                        <button class="seg-option" data-set-theme="light">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
                            Light
                        </button>
                        <button class="seg-option" data-set-theme="dark">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                            Dark
                        </button>
                        <button class="seg-option" data-set-theme="system">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                            System
                        </button>
                    </div>
                </div>
            </div>

            <div class="setting-row">
                <div class="setting-info">
                    <span class="setting-label">Accent color</span>
                    <span class="setting-hint">Tints highlights, buttons, and glows.</span>
                </div>
                <div class="setting-control">
                    <div class="swatches" role="group" aria-label="Accent color">
                        <button class="swatch" data-set-accent="blue" style="background:#3b82f6" aria-label="Blue"></button>
                        <button class="swatch" data-set-accent="violet" style="background:#8b5cf6" aria-label="Violet"></button>
                        <button class="swatch" data-set-accent="emerald" style="background:#10b981" aria-label="Emerald"></button>
                        <button class="swatch" data-set-accent="rose" style="background:#f43f5e" aria-label="Rose"></button>
                        <button class="swatch" data-set-accent="amber" style="background:#f59e0b" aria-label="Amber"></button>
                        <button class="swatch" data-set-accent="cyan" style="background:#06b6d4" aria-label="Cyan"></button>
                    </div>
                </div>
            </div>

            <div class="setting-row">
                <div class="setting-info">
                    <span class="setting-label">Animations</span>
                    <span class="setting-hint">Turn off transitions and motion for a snappier, quieter UI.</span>
                </div>
                <div class="setting-control">
                    <button class="switch" data-toggle-anim role="switch" aria-checked="true" aria-label="Toggle animations"></button>
                </div>
            </div>
        </div>
    </div>
</section>
