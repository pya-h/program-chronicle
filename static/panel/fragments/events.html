<section class="section-shell" data-section="events">
    <header class="section-header">
        <div class="section-title-block">
            <h1 class="section-title">Events</h1>
            <p class="section-description">Program events for an indexed program, newest first.</p>
        </div>
    </header>

    <article class="card">
        <div class="card-head">
            <div class="card-head-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            </div>
            <div>
                <h2 class="card-head-title">Events</h2>
                <p class="card-head-sub" id="ev-count">Select a program to begin.</p>
            </div>
        </div>

        <div class="filter-bar">
            <div class="input-group">
                <label for="ev-program" class="input-label">Program</label>
                <div class="select-wrap">
                    <select id="ev-program" class="input-field select-field">
                        <option value="" disabled selected>Select a program…</option>
                    </select>
                </div>
            </div>
            <div class="input-group">
                <label for="ev-discriminator" class="input-label">Discriminator</label>
                <input type="text" id="ev-discriminator" class="input-field" placeholder="8-byte hex" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="ev-signature" class="input-label">Tx Signature</label>
                <input type="text" id="ev-signature" class="input-field" placeholder="base58 signature" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="ev-from" class="input-label">From Slot</label>
                <input type="number" id="ev-from" class="input-field" placeholder="min" min="0">
            </div>
            <div class="input-group">
                <label for="ev-to" class="input-label">To Slot</label>
                <input type="number" id="ev-to" class="input-field" placeholder="max" min="0">
            </div>
            <button type="button" class="btn btn-primary" id="ev-apply">Search</button>
        </div>

        <div id="ev-root"></div>

        <div class="empty-state" id="ev-empty" hidden>
            <div class="empty-state-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            </div>
            <p class="empty-state-title">No events</p>
            <p class="empty-state-text">Pick a program above, or adjust the discriminator / signature / slot filters.</p>
        </div>

        <div class="list-pager" id="ev-pager"></div>
    </article>

    <div class="modal-overlay" id="ev-detail-modal" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="ev-detail-title">
            <div class="modal-header">
                <h2 class="modal-title" id="ev-detail-title">Event</h2>
                <button type="button" class="modal-close" data-close-modal aria-label="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="rpc-detail-block">
                    <span class="rpc-detail-label">Tx Signature</span>
                    <span class="rpc-detail-value mono" id="ev-detail-signature">—</span>
                </div>
                <div class="rpc-detail-block">
                    <span class="rpc-detail-label">Discriminator</span>
                    <span class="rpc-detail-value mono" id="ev-detail-discriminator">—</span>
                </div>
                <div class="detail-grid">
                    <div class="rpc-detail-block">
                        <span class="rpc-detail-label">Log Index</span>
                        <span class="rpc-detail-value" id="ev-detail-logindex">—</span>
                    </div>
                    <div class="rpc-detail-block">
                        <span class="rpc-detail-label">Slot</span>
                        <span class="rpc-detail-value" id="ev-detail-slot">—</span>
                    </div>
                    <div class="rpc-detail-block">
                        <span class="rpc-detail-label">Block Time</span>
                        <span class="rpc-detail-value" id="ev-detail-time">—</span>
                    </div>
                </div>
                <div class="rpc-detail-block">
                    <div class="detail-data-head">
                        <span class="rpc-detail-label">Data</span>
                        <button type="button" class="pager-btn" id="ev-detail-data-toggle">Show hex</button>
                    </div>
                    <div class="detail-data" id="ev-detail-data">—</div>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" data-close-modal>Close</button>
            </div>
        </div>
    </div>
</section>
